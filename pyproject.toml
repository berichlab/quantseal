[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantseal"
version = "0.1.0"
description = "Self-hosted anti-overfitting autonomous quant research lab with bounded JSON hypotheses, single-shot frozen validation, cluster-bootstrap statistical gates, and anytime-valid E-value shadow tracking."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "berichlab" }
]
keywords = [
    "quantitative-finance",
    "backtesting",
    "anti-overfitting",
    "e-value",
    "mcp",
    "self-hosted",
    "llm-research",
    "falsification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "numpy>=1.26.4,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
    "httpx>=0.27.2,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-multipart>=0.0.12,<1.0.0",
]

[project.urls]
Homepage = "https://berich.cc/quantseal"
Repository = "https://github.com/berichlab/quantseal"
Issues = "https://github.com/berichlab/quantseal/issues"
Organization = "https://github.com/berichlab"

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.50"]
parquet = ["pyarrow>=17.0.0"]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
quantseal = "quantseal.__main__:main"

[tool.setuptools.packages.find]
include = ["quantseal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
